<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 완료 | Good Day Taxi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 공통 헤더 -->
    <!-- ✅ 정적 처리 대상이라면 이렇게 -->
    <link rel="stylesheet" href="/common/header.css">
    <script src="/common/header.js" defer></script>


    <style>
        :root {
            --primary: #8A5DF6;
            --bg: #f7f7fb;
            --text: #222;
            --radius: 20px;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 80px);
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px 32px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 10px;
            color: var(--text);
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 28px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header></header>
<main>
    <div class="card">
        <div class="icon">🎉</div>
        <h1>결제가 완료되었습니다</h1>
        <p>
            안전하게 결제가 처리되었습니다.<br />
            이용해주셔서 감사합니다.
        </p>

        <button class="btn" onclick="goHome()">홈으로 돌아가기</button>
    </div>
</main>

<script>
    /* ===== 인증 가드 ===== */
    function guardPassenger() {
        const token = localStorage.getItem("accessToken");
        const role = localStorage.getItem("role");

        if (!token || role !== "PASSENGER") {
            location.href = "/index.html";
            return false;
        }
        return true;
    }

    async function loadHeader() {
        const header = document.querySelector("header");
        const res = await fetch("/common/header.html");
        header.innerHTML = await res.text();
    }

    /* ===== 초기화 ===== */
    async function init() {
        if (!guardPassenger()) return;
        await loadHeader();

        /**
         * ✅ 결제 성공 페이지는
         * processing.html 을 통해서만 접근 가능
         */
        if (!sessionStorage.getItem("paymentCompleted")) {
            location.href = "/passenger/dashboard/index.html";
            return;
        }
        sessionStorage.removeItem("paymentCompleted");

        /**
         * ✅ 결제 관련 상태 정리
         */
        localStorage.removeItem("unpaidTrip");
        localStorage.removeItem("tripId");
        localStorage.removeItem("tripStatus");
    }

    function goHome() {
        location.href = "/passenger/dashboard/index.html";
    }

    init();
</script>

</body>
</html>
